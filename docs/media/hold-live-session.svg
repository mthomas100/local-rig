<text class="c11" x="18" y="288" fill="#d7dae0"></text>
<text class="c12" x="18" y="307" fill="#d7dae0">{"error":{"code":503,"message":"503 Service Unavailable: the local LLM is held (render \"reel stills too</text>
<text class="c13" x="18" y="326" fill="#d7dae0">-much\" since 21:18). This request was not sent to the model, so nothing was loaded. pi waits and contin</text>
<text class="c14" x="18" y="345" fill="#d7dae0">ues by itself; anything else: retry when `hold status` says open.","type":"llm_held"}}</text>
